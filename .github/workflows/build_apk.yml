name: Build Race Panel Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17 (JDK)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Build APK with Gradle
      working-directory: ./projek-race-panel/android_app
      run: |
        gradle assembleDebug --stacktrace

    - name: Rename Output APK
      working-directory: ./projek-race-panel/android_app
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk ../RacePanel-MXKing.apk

    - name: Upload APK Artifact (Direct Download)
      uses: actions/upload-artifact@v4
      with:
        name: RacePanel-MXKing-APK
        path: ./projek-race-panel/RacePanel-MXKing.apk
        retention-days: 30
